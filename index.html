<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#15171d">
    <meta name="description" content="Jogo de encaixe e deslizamento IQFlow para navegador.">
    <title>IQFlow</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <h1>IQFlow</h1>
        <p>Monte livremente e deslize as peças pelas entradas do tabuleiro.</p>
      </div>

      <div class="controls" aria-label="Controles do jogo">
        <a class="control-link" href="https://github.com/pnferreira/iqflow/tree/main/python">Versão Python</a>
        <button id="rotate-button" type="button">Girar peça</button>
        <button id="reset-button" type="button">Reiniciar</button>
      </div>
    </header>

    <nav class="mobile-toolbar" aria-label="Controles para celular">
      <div class="mobile-view-controls">
        <button id="show-board-button" type="button">Tabuleiro</button>
        <button id="show-pieces-button" type="button">Peças</button>
      </div>
      <div class="mobile-move-controls" aria-label="Mover peça selecionada">
        <button type="button" data-move="left" aria-label="Mover para a esquerda">Esq.</button>
        <button type="button" data-move="up" aria-label="Mover para cima">Cima</button>
        <button type="button" data-move="down" aria-label="Mover para baixo">Baixo</button>
        <button type="button" data-move="right" aria-label="Mover para a direita">Dir.</button>
      </div>
    </nav>

    <main>
      <canvas
        id="game-canvas"
        tabindex="0"
        aria-label="Tabuleiro IQFlow. Arraste as peças da zona de montagem para as entradas do tabuleiro."
      >
        Seu navegador não suporta Canvas.
      </canvas>
    </main>

    <footer>
      <span>Arraste para mover</span>
      <span>No celular, selecione a peça e toque numa entrada</span>
      <span>Botão direito ou R para girar</span>
      <span>Setas para deslizar</span>
    </footer>

    <div id="status" class="status" role="status" aria-live="polite"></div>
  </body>
</html>
